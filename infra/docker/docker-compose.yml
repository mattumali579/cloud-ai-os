# Cloud AI OS â€” LOCAL Phase 1 stack (ARCHITECTURE.md Â§14, Â§15 P1).
# db + agent-api + worker + n8n. Local postgres â€” on Oracle, Supabase is the DB
# (see docker-compose.oracle.yml).
#
#   docker compose -f infra/docker/docker-compose.yml up -d
#
# Memory plan (2 OCPU / 12 GB Oracle assumption, ~8 GB planned budget):
#   api 512m + worker 1g + n8n 768m + db 512m = ~2.8 GB limits â†’ generous headroom.

name: cloudos

services:
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudos
      POSTGRES_PASSWORD: cloudos
      POSTGRES_DB: cloudos
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Loopback only (security 2026-11-23): never publish the DB on LAN/Wi-Fi.
      - "127.0.0.1:5432:5432"
      - "[::1]:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudos -d cloudos"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  agent-api:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: cloudos:dev
    command: ["uvicorn", "cloudos.api.app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      # Loopback only (security 2026-11-23). Phone/tailnet access goes through
      # scripts/https_proxy.py on :8443 (tailnet + loopback clients only).
      - "127.0.0.1:8080:8080"
      - "[::1]:8080:8080"
    env_file:
      - path: ../../.env
        required: false          # copy .env.example â†’ .env; compose still validates without it
    environment:
      # Inside the compose network the DB host is the service name, not localhost.
      DATABASE_URL: postgresql://cloudos:cloudos@db:5432/cloudos
      # Local Revenue OS must operate on the real checkout rather than the
      # immutable pip-install location inside site-packages.
      CLOUDOS_ROOT: /workspace
      PYTHONPATH: /workspace/src
      CODEX_WORKSPACE: /workspace
      HOME: /home/cloudos
    working_dir: /workspace
    volumes:
      - type: bind
        source: ../..
        target: /workspace
      # Reuse existing subscription logins: no API keys and no second login.
      - type: bind
        source: ${USERPROFILE}/.codex
        target: /home/cloudos/.codex
      - type: bind
        source: ${USERPROFILE}/.claude
        target: /home/cloudos/.claude
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m

  worker:
    profiles: ["container-worker"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.job-agent
    image: cloudos-job-worker:dev
    command: ["python", "-m", "cloudos.worker"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgresql://cloudos:cloudos@db:5432/cloudos
      JOB_BROWSER_EXECUTABLE_PATH: /usr/bin/chromium
    volumes:
      - ../../data:/app/data
      - job-resumes:/app/resumes
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g

  n8n:
    restart: unless-stopped
    # Pinned (2026-11-23 GB-2). Upgrade: back up the n8n-data volume, test the new
    # tag on a restored copy, then bump this tag. Rollback image: 2.41.6-local-backup.
    image: docker.n8n.io/n8nio/n8n:2.48.8
    ports:
      # Loopback only (security 2026-11-23): n8n must never be reachable off-host.
      - "127.0.0.1:5679:5678"   # host 5679: 5678 is commonly taken by other local n8n instances
      - "[::1]:5679:5678"
    # No env_file (GB-2): the container used to load the whole repo .env (GitHub,
    # Twilio, SMTP, Discord, DB secrets). The two retained workflows need none of
    # them; the encryption key lives in the volume (/home/node/.n8n/config).
    environment:
      # SQLite backend by default (contract Â§12) â€” protects the Supabase 500 MB budget.
      NODE_OPTIONS: "--max-old-space-size=512"
      GENERIC_TIMEZONE: "America/Chicago"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Retained workflows (library collector, error reporter) read no $env values.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      # n8n 2.x always uses the internal JS task runner. This flag is ignored;
      # a blocked runner event loop still fails the ~30s heartbeat.
      N8N_RUNNERS_ENABLED: "false"
      # Keep the collector's multi-minute API run inside the task budget.
      # Upstream will otherwise drop the default from 300s to 60s.
      N8N_RUNNERS_TASK_TIMEOUT: "600"
      N8N_RUNNERS_HEARTBEAT_INTERVAL: "30"
      # child_process: library collector runs /data/scripts/library_collector.mjs.
      # fs/path/crypto: collector + error reporter write under /data/research-alerts.
      NODE_FUNCTION_ALLOW_BUILTIN: child_process,fs,path,crypto
    volumes:
      - n8n-data:/home/node/.n8n
      - type: bind
        source: ../../work/research-alerts
        target: /data/research-alerts
      - type: bind
        source: ../../scripts
        target: /data/scripts
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 768m

  research-engine:
    restart: unless-stopped
    image: cloudos-research:dev
    command: ["python", "-m", "research.service"]
    ports:
      - "127.0.0.1:5055:5055"   # loopback only (security 2026-11-23)
      - "[::1]:5055:5055"
    environment:
      DATABASE_URL: postgresql://cloudos:cloudos@db:5432/cloudos
      PYTHONPATH: /workspace
      RESEARCH_BASE_DIR: /workspace/data/ONLINE_MONEY_RESEARCH
      HOME: /home/cloudos
    working_dir: /workspace
    volumes:
      - type: bind
        source: ../..
        target: /workspace
      - type: bind
        source: ${USERPROFILE}/.gemini
        target: /home/cloudos/.gemini
      - type: bind
        source: ${USERPROFILE}/.gemini/antigravity/scratch/ONLINE_MONEY_RESEARCH
        target: /workspace/data/ONLINE_MONEY_RESEARCH
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m

volumes:
  db-data:
  n8n-data:
  job-resumes:

