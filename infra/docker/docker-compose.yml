# Cloud AI OS â€” LOCAL Phase 1 stack (ARCHITECTURE.md Â§14, Â§15 P1).
# db + agent-api + worker + n8n. Local postgres â€” on Oracle, Supabase is the DB
# (see docker-compose.oracle.yml).
#
#   docker compose -f infra/docker/docker-compose.yml up -d
#
# Memory plan (2 OCPU / 12 GB Oracle assumption, ~8 GB planned budget):
#   api 512m + worker 1g + n8n 768m + db 512m = ~2.8 GB limits â†’ generous headroom.

name: cloudos

services:
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudos
      POSTGRES_PASSWORD: cloudos
      POSTGRES_DB: cloudos
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudos -d cloudos"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  agent-api:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: cloudos:dev
    command: ["uvicorn", "cloudos.api.app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    env_file:
      - path: ../../.env
        required: false          # copy .env.example â†’ .env; compose still validates without it
    environment:
      # Inside the compose network the DB host is the service name, not localhost.
      DATABASE_URL: postgresql://cloudos:cloudos@db:5432/cloudos
      # Local Revenue OS must operate on the real checkout rather than the
      # immutable pip-install location inside site-packages.
      CLOUDOS_ROOT: /workspace
      PYTHONPATH: /workspace/src
      CODEX_WORKSPACE: /workspace
      HOME: /home/cloudos
    working_dir: /workspace
    volumes:
      - type: bind
        source: ../..
        target: /workspace
      # Reuse existing subscription logins: no API keys and no second login.
      - type: bind
        source: ${USERPROFILE}/.codex
        target: /home/cloudos/.codex
      - type: bind
        source: ${USERPROFILE}/.claude
        target: /home/cloudos/.claude
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m

  worker:
    profiles: ["container-worker"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.job-agent
    image: cloudos-job-worker:dev
    command: ["python", "-m", "cloudos.worker"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgresql://cloudos:cloudos@db:5432/cloudos
      JOB_BROWSER_EXECUTABLE_PATH: /usr/bin/chromium
    volumes:
      - ../../data:/app/data
      - job-resumes:/app/resumes
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g

  n8n:
    restart: unless-stopped
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5679:5678"   # host 5679: 5678 is commonly taken by other local n8n instances
    env_file:
      - path: ../../.env         # supplies N8N_BASIC_AUTH_USER / N8N_BASIC_AUTH_PASSWORD
        required: false
    environment:
      # SQLite backend by default (contract Â§12) â€” protects the Supabase 500 MB budget.
      NODE_OPTIONS: "--max-old-space-size=512"
      GENERIC_TIMEZONE: "America/Chicago"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Revenue OS workflows intentionally read these internal runtime values.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      AGENT_API_URL: "http://agent-api:8080"
      AGENT_API_TOKEN: "${AGENT_API_TOKEN}"
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 768m

  research-engine:
    restart: unless-stopped
    image: cloudos-research:dev
    command: ["python", "-m", "research.service"]
    ports:
      - "5055:5055"
    environment:
      DATABASE_URL: postgresql://cloudos:cloudos@db:5432/cloudos
      PYTHONPATH: /workspace
      RESEARCH_BASE_DIR: /workspace/data/ONLINE_MONEY_RESEARCH
      HOME: /home/cloudos
    working_dir: /workspace
    volumes:
      - type: bind
        source: ../..
        target: /workspace
      - type: bind
        source: ${USERPROFILE}/.gemini
        target: /home/cloudos/.gemini
      - type: bind
        source: ${USERPROFILE}/.gemini/antigravity/scratch/ONLINE_MONEY_RESEARCH
        target: /workspace/data/ONLINE_MONEY_RESEARCH
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m

volumes:
  db-data:
  n8n-data:
  job-resumes:

