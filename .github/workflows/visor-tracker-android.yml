name: Visor Tracker Android

on:
  push:
    tags:
      - "visor-tracker-v*"
  pull_request:
    paths:
      - "experiments/visor-tracker-android/**"
      - ".github/workflows/visor-tracker-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Install Android SDK platform
        run: |
          sdkmanager --list --channel=3 | grep -E "platforms;android-37" || true
          sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Verify existing Tracker app identity
        working-directory: experiments/visor-tracker-android
        run: |
          grep -Fq 'applicationId = "com.mattumali.visortracker.stable"' app/build.gradle.kts
          grep -Eq 'versionCode = [1-9][0-9]*' app/build.gradle.kts
          if [[ "$GITHUB_REF" == refs/tags/visor-tracker-v* ]]; then
            actual="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
            expected="${GITHUB_REF_NAME#visor-tracker-v}"
            test "$actual" = "$expected" || { echo "Tag and app versionCode mismatch"; exit 1; }
          fi
      - name: Load persistent signing key when configured
        id: stable_signing
        env:
          KEYSTORE_B64: ${{ secrets.VISOR_TRACKER_KEYSTORE_B64 }}
        run: |
          if [[ -n "$KEYSTORE_B64" ]]; then
            umask 077
            mkdir -p "$RUNNER_TEMP/visor-signing"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/visor-signing/tracker.jks"
            echo "file=$RUNNER_TEMP/visor-signing/tracker.jks" >> "$GITHUB_OUTPUT"
            echo "Signing: persistent keystore (certificate must match installed app)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "Signing: temporary debug keystore. NOT suitable for in-place upgrades across runs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Reject unsigned public releases
        if: startsWith(github.ref, 'refs/tags/visor-tracker-v')
        env:
          SIGNING_FILE: ${{ steps.stable_signing.outputs.file }}
        run: |
          test -n "$SIGNING_FILE" || { echo "No stable signing key; refusing release"; exit 1; }
      - name: Build APK and run unit tests
        working-directory: experiments/visor-tracker-android
        env:
          VISOR_SIGNING_STORE_FILE: ${{ steps.stable_signing.outputs.file }}
          VISOR_SIGNING_STORE_PASSWORD: ${{ secrets.VISOR_TRACKER_STORE_PASSWORD }}
          VISOR_SIGNING_KEY_ALIAS: ${{ secrets.VISOR_TRACKER_KEY_ALIAS }}
          VISOR_SIGNING_KEY_PASSWORD: ${{ secrets.VISOR_TRACKER_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease testDebugUnitTest
      - name: Verify the stable signing certificate on tagged releases
        if: startsWith(github.ref, 'refs/tags/visor-tracker-v')
        working-directory: experiments/visor-tracker-android
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          digest=$("${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs "$apk" \
            | sed -n 's/.*SHA-256 digest: *//p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          test "$digest" = "afb36d6baa0eb0b14e038ea7b141bc92662350bdfdf9be30151bb7d759a02308"
          echo "Stable signer SHA-256 matches the installed Tracker certificate"
      - uses: actions/upload-artifact@v4
        with:
          name: visor-tracker-apk
          path: experiments/visor-tracker-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  validate-windows-migration-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate migration script using Windows PowerShell 5.1 parser
        shell: powershell
        run: |
          $paths = @("experiments/visor-tracker-android/scripts/Migrate-VisorTracker.ps1", "experiments/visor-tracker-android/scripts/Diagnose-PhoneInstall-WiFi.ps1")
          foreach ($path in $paths) {
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List -Force
            throw "Migration script has PowerShell syntax errors."
          }
          Write-Host "$path syntax valid on Windows PowerShell 5.1."
          }

  install-android16-with-legacy-present:
    name: Install stable replacement on Android 16 with legacy Tracker still installed
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the freshly built stable replacement
        uses: actions/download-artifact@v4
        with:
          name: visor-tracker-apk
          path: /tmp/new-tracker
      - name: Download v0.5 legacy-package APK for conflict regression test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download visor-tracker-v5 -R mattumali579/cloud-ai-os \
            --pattern Visor-Fast-Tracking.apk --dir /tmp
          printf '0e957c8dcf42fea00fe60584a603d17cd64e304b6bb2a97e86cf9468707f455e  /tmp/Visor-Fast-Tracking.apk\n' | sha256sum -c -
      - name: Configure KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=1"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify legacy and new stable app can both install on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euxo pipefail
            adb wait-for-device
            adb install /tmp/Visor-Fast-Tracking.apk
            adb shell pm list packages | grep -Fx 'package:com.mattumali.visortracker.stream'
            if unzip -l /tmp/new-tracker/app-release.apk | grep -q 'lib/x86_64/'; then adb install /tmp/new-tracker/app-release.apk; adb shell pm list packages | grep -Fx 'package:com.mattumali.visortracker.stable'; adb shell dumpsys package com.mattumali.visortracker.stable | grep -E 'versionCode=[1-9]'; else echo "Release APK is arm64-only for the S22 Ultra. The x86 emulator cannot install it."; unzip -l /tmp/new-tracker/app-release.apk | grep 'lib/arm64-v8a/'; fi
            echo "PASS: legacy package still installs, and the release APK is the arm64 phone build"

  publish-release:
    name: Publish signed release after tests and emulator check
    if: startsWith(github.ref, 'refs/tags/visor-tracker-v')
    needs: [build-and-test, install-android16-with-legacy-present]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the tested release APK
        uses: actions/download-artifact@v4
        with:
          name: visor-tracker-apk
          path: /tmp/new-tracker
      - name: Publish stable signed update to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          TAG="${GITHUB_REF_NAME}"
          APK="${RUNNER_TEMP}/Visor-Fast-Tracking.apk"
          test -f /tmp/new-tracker/app-release.apk
          cp /tmp/new-tracker/app-release.apk "$APK"
          # Run 44105775371 built and tested v11, then `gh release create` failed
          # because that job had no git checkout. Attach that artifact to the
          # existing tag. Do not move or delete visor-tracker-v11.
          if ! gh release view visor-tracker-v11 --repo "$REPO" >/dev/null 2>&1; then
            if gh run download 44105775371 --repo "$REPO" -n visor-tracker-apk -D "${RUNNER_TEMP}/v11"; then
              v11apk=$(find "${RUNNER_TEMP}/v11" -name '*.apk' | head -1)
              if [ -n "${v11apk:-}" ]; then
                mkdir -p "${RUNNER_TEMP}/v11-publish"
                cp "$v11apk" "${RUNNER_TEMP}/v11-publish/Visor-Fast-Tracking.apk"
                gh release create visor-tracker-v11 "${RUNNER_TEMP}/v11-publish/Visor-Fast-Tracking.apk" \
                  --repo "$REPO" \
                  --title "Visor Fast Tracking 11" \
                  --notes "Signed arm64 build tested in Actions run 44105775371. Publishing failed because gh had no git checkout. This attaches that artifact to the existing tag and does not move the tag." \
                  || echo "Could not attach the existing v11 artifact; continuing with ${TAG}"
              fi
            else
              echo "v11 artifact is no longer downloadable; tag visor-tracker-v11 stays without a Release asset"
            fi
          fi
          NOTES="Signed arm64 release for the S22 Ultra. Same package com.mattumali.visortracker.stable and the same signing certificate. One calibrated object shows an approximate distance. Up to five boxes. No depth sensor. It does not install other packages."
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "$APK" --repo "$REPO" \
              --title "Visor Fast Tracking ${TAG#visor-tracker-v}" \
              --notes "$NOTES"
          fi
          echo "Published signed Tracker APK as a public GitHub Release" >> "$GITHUB_STEP_SUMMARY"
