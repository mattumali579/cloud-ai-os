name: Revenue OS tests

on:
  push:
    paths:
      - 'docs/revenue_os_master_prompt.md'
      - 'n8n/revenue_os_main.json'
      - 'src/cloudos/revenue_os.py'
      - 'src/cloudos/outreach/sender.py'
      - 'src/cloudos/api/app.py'
      - 'src/cloudos/api/schemas.py'
      - 'db/migrations/**'
      - 'infra/docker/Dockerfile'
      - 'infra/docker/docker-compose.yml'
      - 'tests/test_revenue_os.py'
      - '.github/workflows/revenue-os-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cloudos
          POSTGRES_PASSWORD: cloudos
          POSTGRES_DB: cloudos
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U cloudos -d cloudos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile changed Python
        run: python -m py_compile src/cloudos/revenue_os.py src/cloudos/outreach/sender.py src/cloudos/api/app.py src/cloudos/api/schemas.py
      - name: Validate n8n JSON
        run: python -c "import json, pathlib; d=json.loads(pathlib.Path('n8n/revenue_os_main.json').read_text()); assert any(n['name']=='TROUBLESHOOTER BOT' for n in d['nodes']); print(len(d['nodes']), 'nodes')"
      - name: Verify full migration sequence on plain Postgres
        env:
          DATABASE_URL: postgresql://cloudos:cloudos@127.0.0.1:55433/cloudos
        run: |
          python - <<'PY'
          from cloudos import db
          applied = db.migrate()
          print("applied:", applied)
          assert "004_school_system" in applied
          assert "010_revenue_os" in applied
          with db.get_conn() as conn:
              assert conn.execute("select to_regclass('public.revenue_os_evidence') as r").fetchone()["r"]
          PY
      - name: Revenue OS tests
        run: python -m pytest -q tests/test_revenue_os.py tests/test_claude_task.py tests/test_db.py
      - name: Build local Revenue OS API image
        run: docker build -f infra/docker/Dockerfile -t cloudos:revenue-os-test .
