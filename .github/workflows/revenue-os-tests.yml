name: Revenue OS tests

on:
  push:
    paths:
      - 'docs/revenue_os_master_prompt.md'
      - 'n8n/revenue_os_main.json'
      - 'src/cloudos/revenue_os.py'
      - 'src/cloudos/api/app.py'
      - 'src/cloudos/api/schemas.py'
      - 'tests/test_revenue_os.py'
      - '.github/workflows/revenue-os-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile changed Python
        run: python -m py_compile src/cloudos/revenue_os.py src/cloudos/api/app.py src/cloudos/api/schemas.py
      - name: Validate n8n JSON
        run: python -c "import json, pathlib; d=json.loads(pathlib.Path('n8n/revenue_os_main.json').read_text()); assert any(n['name']=='TROUBLESHOOTER BOT' for n in d['nodes']); print(len(d['nodes']), 'nodes')"
      - name: Revenue OS tests
        run: python -m pytest -q tests/test_revenue_os.py tests/test_claude_task.py
