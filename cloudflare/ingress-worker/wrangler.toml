# cloudos-ingress — Cloudflare Worker, FREE PLAN ONLY (ARCHITECTURE.md §0, §13).
# No paid features: no Queues, no Durable Objects, no KV, no D1, no Workers AI
# binding. Stateless ingress + health cron only; CPU work is trivial (HMAC + proxy)
# to stay well inside free-plan CPU-ms limits.

name = "cloudos-ingress"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Direct Discord heartbeat + origin health check every 30 minutes.
# Cron Triggers are included on the Workers Free plan.
[triggers]
crons = ["*/30 * * * *"]

# ── Configuration ────────────────────────────────────────────────────────────
# ALL runtime configuration is delivered as SECRETS, never as committed vars
# (the webhook/origin URLs reveal infrastructure endpoints; the other two are
# credentials). Set each one with:
#
#   wrangler secret put WEBHOOK_SECRET       # HMAC key for POST /hook/* (X-Signature)
#   wrangler secret put AGENT_API_TOKEN      # bearer for /api/* + origin auth (§4 AGENT_API_TOKEN)
#   wrangler secret put ORIGIN_URL           # e.g. https://<oracle-vm-host>:8080 (no trailing slash)
#   wrangler secret put NOTIFY_WEBHOOK_URL   # n8n health_alert webhook (direct, or this worker's /hook/health-alert)
#   wrangler secret put DISCORD_WEBHOOK_URL  # direct heartbeat destination
#
# Placeholders below are documentation only — leave [vars] empty in production;
# a secret with the same name overrides a var.
[vars]
# WEBHOOK_SECRET     = "<set via wrangler secret put>"
# AGENT_API_TOKEN    = "<set via wrangler secret put>"
# ORIGIN_URL         = "<set via wrangler secret put>"
# NOTIFY_WEBHOOK_URL = "<set via wrangler secret put>"
# DISCORD_WEBHOOK_URL = "<set via wrangler secret put>"
