# BrightReach offer catalog used by pricing replies, audits and proposals.
# The active outreach campaign is Google Reviews / Maps. Legacy offers remain
# available to their existing product paths, but are not the default here.
# Nothing outside this file may be quoted to a prospect. Change prices HERE.

default_offer: google_reviews_maps

offers:
  google_reviews_maps:
    name: Google Reviews + Google Maps Visibility
    setup_usd: null
    monthly_usd: 299
    price_text: "$299/month, month to month"
    deliverables:
      - Legitimate review-request workflow for all customers without review gating
      - Review monitoring and owner-response workflow
      - Google Business Profile and local Maps visibility improvements
      - Monthly progress reporting
    timeline: "Initial setup and profile review in the first week"
    guarantee: null
    client_responsibilities:
      - Google Business Profile access
      - A customer contact list or an approved point in the service workflow for review requests
      - Timely approval of suggested owner responses
  missed_call_rescue:
    name: Missed-Call Rescue
    setup_usd: 497
    monthly_usd: 49
    price_text: "$0 to start, then $497 once only after your dashboard shows 5 recovered callers"
    deliverables:
      - Every missed call gets a text from your business within seconds
      - A short text conversation that asks what they need, their ZIP and how soon, then texts you the lead
      - Three follow-up texts on every estimate until they answer
      - A private dashboard showing recovered callers and the jobs you mark won
      - Setup and carrier registration done for you; the phone number is yours
    timeline: "Registration is filed on day 1; go-live when the carrier approves (days to a few weeks)"
    guarantee: "If your dashboard doesn't show at least 5 recovered callers in your first 30 days after go-live, you pay nothing and I keep it running free until it does."
    client_responsibilities:
      - Business details for carrier registration (legal name, EIN, address, website)
      - Turn on no-answer call forwarding on your business line (one code; I walk you through it)
      - Hours, service area and booking link
  recovery_build:
    name: Missed-Call Revenue Recovery Build
    setup_usd: 1500
    monthly_usd: null
    price_text: "$1,500 one-time"
    deliverables:
      - Instant text-back on every missed call
      - A booking link in every text conversation
      - Same-day automated quote follow-ups
      - Runs 24/7; you own it
    timeline: null            # not in the offer sheet - proposals say "to confirm"
    guarantee: "If it's not texting back missed calls and booking jobs within 30 days of go-live, I keep working free until it does, or you get your money back."
    client_responsibilities:   # needed to install it; proposals mark these "confirm on kickoff"
      - Business phone number/provider access so missed calls can be forwarded
      - Calendar access (Google or Outlook) for booking
      - One kickoff conversation to confirm services, hours and service area
  hosted:
    name: Care Plan
    setup_usd: null
    monthly_usd: 49
    price_text: "$49/month after the first 2 months free, month to month"
    deliverables:
      - Hosting and monitoring
      - Tweaks and changes as needed
      - Monthly report (calls caught, texts sent, jobs booked)
    timeline: "Starts after the build is live"
    guarantee: "Month to month. No contract. Cancel anytime and you keep your number."
    client_responsibilities: []
  lead_pack:
    name: Lead Pack
    setup_usd: null
    monthly_usd: null
    price_text: "$150-200 one-time for 25 exclusive leads"
    deliverables:
      - 25 exclusive trade leads, never resold
    timeline: null
    guarantee: "If the first batch doesn't turn into booked jobs, the next batch is free."
    client_responsibilities: []

out_of_scope:
  - Website redesigns
  - Ad management
  - Promised lead counts on the agent tiers
  - Answering phones live
