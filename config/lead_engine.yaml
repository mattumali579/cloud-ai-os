# Fresh lead generator settings. Every number here is a knob, not a promise.
inventory:
  daily_new_target: 300     # NEW never-contacted, qualified companies to find every day (America/Chicago day)
  timezone: America/Chicago
  target_ready: 500          # refill until at least this many outreach-ready NEW companies exist
  low_watermark: 300         # start a refill when ready inventory drops below this
  total_goal: 4000           # long-run goal: unique qualified companies

run:
  max_minutes: 150           # time budget for one automatic cycle
  enrich_workers: 16         # websites checked in parallel (one request at a time per site)
  http_timeout: 12
  max_pages_per_site: 4

handoff:
  airtable_ready_window: 150  # keep at most this many engine leads waiting in Airtable
  airtable_record_ceiling: 950 # Airtable free plan caps a base at 1,000 records
  status: Ready
  offer: Missed-call and quote follow-up for local service businesses

sources:
  osm:
    enabled: true
    radius_m: 25000
    min_interval_s: 6
  google_maps:
    enabled: true
    url_env: GMAPS_SCRAPER_URL
    max_time_s: 420
    depth: 1
  history_recovery:
    enabled: true
    batch: 40

failure_policy:
  disable_after: 3           # consecutive failures before a source is benched
  base_backoff_minutes: 15   # doubles each extra failure
  max_backoff_minutes: 1440

# key: internal industry; maps: Google Maps search phrase; osm: Overpass tag filters
industries:
  roofing:      {maps: "roofing contractor", osm: ['["craft"="roofer"]']}
  hvac:         {maps: "hvac contractor",   osm: ['["craft"="hvac"]']}
  plumbing:     {maps: "plumber",           osm: ['["craft"="plumber"]']}
  electrical:   {maps: "electrician",       osm: ['["craft"="electrician"]']}
  remodeling:   {maps: "remodeling contractor", osm: ['["craft"="carpenter"]', '["craft"="tiler"]', '["craft"="floorer"]']}
  painting:     {maps: "painting contractor", osm: ['["craft"="painter"]']}
  landscaping:  {maps: "landscaping company", osm: ['["craft"="gardener"]', '["craft"="landscaper"]']}
  cleaning:     {maps: "cleaning service",  osm: ['["craft"="cleaning"]', '["office"="cleaning"]']}
  pest_control: {maps: "pest control service", osm: ['["craft"="pest_control"]', '["office"="pest_control"]']}
  gym:          {maps: "gym",               osm: ['["leisure"="fitness_centre"]']}
  martial_arts: {maps: "martial arts school", osm: ['["sport"="martial_arts"]', '["amenity"="dojo"]', '["sport"="boxing"]']}
  dentist:      {maps: "dentist",           osm: ['["amenity"="dentist"]', '["healthcare"="dentist"]']}
  med_spa:      {maps: "med spa",           osm: ['["shop"="beauty"]["beauty"~"spa|skin|laser|aesthetic"]', '["amenity"="spa"]']}
  chiropractor: {maps: "chiropractor",      osm: ['["healthcare"="chiropractor"]', '["healthcare:speciality"="chiropractic"]']}
  auto_repair:  {maps: "auto repair shop",  osm: ['["shop"="car_repair"]', '["shop"="tyres"]']}
  veterinary:   {maps: "veterinarian",      osm: ['["amenity"="veterinary"]']}
  law_firm:     {maps: "personal injury lawyer", osm: ['["office"="lawyer"]']}
  accounting:   {maps: "accountant",        osm: ['["office"="accountant"]', '["office"="tax_advisor"]']}
  real_estate:  {maps: "real estate agency", osm: ['["office"="estate_agent"]']}
  insurance:    {maps: "insurance agency",  osm: ['["office"="insurance"]']}
  salon:        {maps: "hair salon",        osm: ['["shop"="hairdresser"]']}
  childcare:    {maps: "daycare",           osm: ['["amenity"="childcare"]']}

