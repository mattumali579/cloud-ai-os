  very_low_review_count_below: 35
  low_review_count_below: 100
  competitor_gap_ratio: 0.45

copy:
  first_touch_max_words: 80
  subject_max_words: 8
  first_touch_has_link: false
  cta: Ask permission to send the short personalized video.
  signature: Matt
  footer_opt_out: 'If you would rather not hear from me, reply "stop" and I will not email you again.'

sequence:
  followup_offsets_days: [2, 2, 3]
  day_mode: calendar

