  preferred_score: 7
  minimum_score: 2
  raw_candidate_target: 700
  industry_priority: [roofing, hvac, plumbing, electrical, remodeling, landscaping, pest_control, painting, cleaning, auto_repair, chiropractor, veterinary, med_spa, dentist]
  require_usable_email: true
  never_contact_previously_contacted: true

