# Extend gitleaks' built-in rules. Without this block the file defines NO rules
# and every scan silently reports "no leaks found" (fixed 2026-11-23).
[extend]
useDefault = true

[allowlist]
description = "Intentional local fixtures, generated research caches, vendor code, and documented detector examples"
paths = [
  '''^\.firecrawl/''',
  '''^\.tools/''',
  '''^\.pytest_cache/''',
  '''^tests/__pycache__/''',
  '''^tests/test_privacy_secrets\.py$''',
  '''^tests/test_privacy_gate\.py$''',
  '''^tests/test_router\.py$''',
  '''^docs/SECURITY\.md$''',
  '''^tests/test_second_brain\.py$'''
]
