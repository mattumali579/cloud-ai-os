# Dedicated stack for the missed-call product.
# Does not use the Cloud AI OS ports (n8n 5679, Postgres 5432).
#   docker compose up -d
# Quick public URL (prints a trycloudflare.com address; it changes on restart):
#   docker compose --profile tunnel up -d

name: brightreach-mctb

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mctb
      POSTGRES_PASSWORD: ${MCTB_DB_PASSWORD:-mctb}
      POSTGRES_DB: mctb
    volumes:
      - mctb-db:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mctb -d mctb"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5680:5678"
    environment:
      NODE_OPTIONS: "--max-old-space-size=512"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Chicago}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-before-real-use}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      TWILIO_MODE: ${TWILIO_MODE:-mock}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      MCTB_PUBLIC_BASE_URL: ${MCTB_PUBLIC_BASE_URL:-http://localhost:5680}
      OWNER_ALERT_WEBHOOK_URL: ${OWNER_ALERT_WEBHOOK_URL:-}
    volumes:
      - mctb-n8n:/home/node/.n8n
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 768m

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://n8n:5678
    depends_on:
      - n8n
    restart: unless-stopped

volumes:
  mctb-db:
  mctb-n8n:
